name: Desktop builds
on:
  push:
    tags: ['v2.*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win --x64
            label: windows-x64
          - os: macos-latest
            args: --mac --arm64 --x64
            label: macos
          - os: ubuntu-latest
            args: --linux --x64
            label: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Real Chromium lifecycle tests
        if: runner.os != 'Linux'
        run: npm run test:integration
      - name: Linux real Chromium lifecycle tests
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:integration
      - name: Gallery smoke test
        if: runner.os != 'Linux'
        run: npx electron . --smoke-test
      - name: Linux gallery smoke test
        if: runner.os == 'Linux'
        run: xvfb-run -a npx electron . --smoke-test --no-sandbox
      - run: npm run dist -- ${{ matrix.args }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Create ready-to-run Windows folder
        if: runner.os == 'Windows'
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/Make-Portable.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Checksums
        run: cd release && sha256sum * > SHA256SUMS.txt
      - name: Publish installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" --title "ZLHRS Theme Studio $GITHUB_REF_NAME" --notes "Theme Studio for Windows, macOS (Apple Silicon and Intel), and Linux. Includes all bundled themes. Requires a compatible installed ChatGPT desktop app. Packages are unsigned. OS builds and gallery smoke tests are automated; actual ChatGPT theme integration is verified on Windows only."
